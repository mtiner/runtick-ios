name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Require signing secrets
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ok=1
          test -n "$P12" || { echo "Missing certificate"; ok=0; }
          test -n "$P12_PASSWORD" || { echo "Missing password"; ok=0; }
          test -n "$API_KEY" || { echo "Missing API key"; ok=0; }
          test -n "$KEY_ID" || { echo "Missing key ID"; ok=0; }
          test -n "$ISSUER_ID" || { echo "Missing issuer ID"; ok=0; }
          test "$ok" = 1
      - name: Select Xcode 27.1
        run: |
          sudo xcode-select -s \
            /Applications/Xcode_27.1_Release_Candidate.app
          xcodebuild -version
      - name: Install distribution certificate
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY" | base64 --decode \
            > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            >> "$GITHUB_ENV"
      - name: Archive and upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -project RunTick.xcodeproj -scheme RunTick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RunTick.xcarchive" \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          path.write_bytes(plistlib.dumps({
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "automatic",
              "teamID": "7D7486BA97",
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": True,
          }))
          PY
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RunTick.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
