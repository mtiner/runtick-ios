name: TestFlight
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: testflight
  cancel-in-progress: false
jobs:
  upload:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require signing secrets
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          ok=1
          test -n "$P12" || { echo "Missing certificate"; ok=0; }
          test -n "$P12_PASSWORD" || { echo "Missing password"; ok=0; }
          test -n "$API_KEY" || { echo "Missing API key"; ok=0; }
          test -n "$KEY_ID" || { echo "Missing key ID"; ok=0; }
          test -n "$ISSUER_ID" || { echo "Missing issuer ID"; ok=0; }
          test "$ok" = 1
      - name: Require compatible Xcode and generate project
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo '::error::RunTick requires the iOS 26 SDK or newer.'
            exit 1
          fi
          brew install xcodegen
          xcodegen generate
      - name: Install distribution certificate
        env:
          P12: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "KEYCHAIN_PATH=$KEYCHAIN" >> "$GITHUB_ENV"
      - name: Install App Store Connect API key
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          echo "$API_KEY" | base64 --decode \
            > "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          echo "KEY_PATH=$HOME/private_keys/AuthKey_${KEY_ID}.p8" \
            >> "$GITHUB_ENV"
      - name: Install App Store profile
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, time, urllib.request
          from pathlib import Path

          def b64(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def der_to_raw(der):
              i = 2
              if der[1] & 0x80:
                  i = 2 + (der[1] & 0x7f)
              def read_int(buf, i):
                  ln = buf[i + 1]
                  return buf[i + 2:i + 2 + ln], i + 2 + ln
              r, i = read_int(der, i)
              s, _ = read_int(der, i)
              return r[-32:].rjust(32, b"\x00") + s[-32:].rjust(32, b"\x00")

          def jwt():
              now = int(time.time())
              header = b64(json.dumps({
                  "alg": "ES256", "kid": os.environ["KEY_ID"], "typ": "JWT",
              }).encode())
              payload = b64(json.dumps({
                  "iss": os.environ["ISSUER_ID"],
                  "iat": now,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              }).encode())
              msg = f"{header}.{payload}".encode()
              der = subprocess.check_output(
                  [
                      "openssl", "dgst", "-sha256", "-sign",
                      os.environ["KEY_PATH"],
                  ],
                  input=msg,
              )
              return f"{header}.{payload}.{b64(der_to_raw(der))}"

          def api(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url, data=data, method=method, headers={
                  "Authorization": f"Bearer {jwt()}",
                  "Content-Type": "application/json",
              })
              try:
                  with urllib.request.urlopen(req) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  raise SystemExit(exc.read().decode()[:500])

          pem = subprocess.check_output([
              "security", "find-certificate", "-c", "Apple Distribution",
              "-p", os.environ["KEYCHAIN_PATH"],
          ])
          sha = subprocess.check_output(
              ["openssl", "x509", "-noout", "-fingerprint", "-sha1"],
              input=pem,
          ).decode().split("=", 1)[1].strip().replace(":", "")
          certs = api(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/certificates"
              "?filter[certificateType]=DISTRIBUTION&limit=20",
          )
          cert_id = None
          for item in certs["data"]:
              raw = base64.b64decode(item["attributes"]["certificateContent"])
              got = subprocess.check_output([
                  "openssl", "x509", "-inform", "DER",
                  "-noout", "-fingerprint", "-sha1",
              ], input=raw).decode().split("=", 1)[1].strip().replace(":", "")
              if got == sha:
                  cert_id = item["id"]
          if not cert_id:
              raise SystemExit(
                  "installed cert is not in App Store Connect"
              )
          bundles = api(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/bundleIds"
              "?filter[identifier]=cc.runtick.app",
          )
          bundle_id = bundles["data"][0]["id"]
          profiles = api(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/profiles"
              "?filter[profileType]=IOS_APP_STORE&limit=50"
              "&include=certificates,bundleId",
          )
          chosen = None
          for item in profiles["data"]:
              rel = item["relationships"]
              cert_rel = rel.get("certificates", {}).get("data", [])
              cert_ids = [c["id"] for c in cert_rel]
              bid = (rel.get("bundleId", {}).get("data") or {}).get("id")
              active = item["attributes"].get("profileState") == "ACTIVE"
              if bid == bundle_id and cert_id in cert_ids and active:
                  chosen = item
                  break
          if chosen is None:
              created = api(
                  "POST",
                  "https://api.appstoreconnect.apple.com/v1/profiles",
                  {
                  "data": {
                      "type": "profiles",
                      "attributes": {
                          "name": "cc.runtick.app App Store",
                          "profileType": "IOS_APP_STORE",
                      },
                      "relationships": {
                          "bundleId": {
                              "data": {
                                  "type": "bundleIds",
                                  "id": bundle_id,
                              },
                          },
                          "certificates": {
                              "data": [{"type": "certificates", "id": cert_id}],
                          },
                      },
                  },
              })
              chosen = created["data"]
          attrs = chosen["attributes"]
          if not attrs.get("profileContent"):
              chosen = api(
                  "GET",
                  "https://api.appstoreconnect.apple.com/v1/profiles/"
                  + chosen["id"],
              )["data"]
              attrs = chosen["attributes"]
          uuid = attrs["uuid"]
          dest = Path.home() / "Library/MobileDevice/Provisioning Profiles"
          dest.mkdir(parents=True, exist_ok=True)
          (dest / f"{uuid}.mobileprovision").write_bytes(
              base64.b64decode(attrs["profileContent"])
          )
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"PROFILE_UUID={uuid}\n")
          print("installed", uuid)
          PY
      - name: Archive and upload
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -project RunTick.xcodeproj -scheme RunTick \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/RunTick.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Apple Distribution' \
            PROVISIONING_PROFILE="$PROFILE_UUID" \
            DEVELOPMENT_TEAM=7D7486BA97 \
            archive
          python3 - <<'PY'
          import os
          import plistlib
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "ExportOptions.plist"
          path.write_bytes(plistlib.dumps({
              "method": "app-store-connect",
              "destination": "upload",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": "7D7486BA97",
              "provisioningProfiles": {
                  "cc.runtick.app": os.environ["PROFILE_UUID"],
              },
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": True,
          }))
          PY
          echo "UPLOAD_AFTER=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "$GITHUB_ENV"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/RunTick.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Submit to external Beta group
        env:
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import base64, json, os, subprocess, time
          import urllib.error, urllib.request
          from datetime import datetime, timedelta, timezone

          def b64(data):
              return base64.urlsafe_b64encode(data).rstrip(b"=").decode()

          def der_to_raw(der):
              i = 2
              if der[1] & 0x80:
                  i = 2 + (der[1] & 0x7f)
              def read_int(buf, i):
                  ln = buf[i + 1]
                  return buf[i + 2:i + 2 + ln], i + 2 + ln
              r, i = read_int(der, i)
              s, _ = read_int(der, i)
              return r[-32:].rjust(32, b"\x00") + s[-32:].rjust(32, b"\x00")

          def token():
              now = int(time.time())
              header = b64(json.dumps({
                  "alg": "ES256",
                  "kid": os.environ["KEY_ID"],
                  "typ": "JWT",
              }).encode())
              payload = b64(json.dumps({
                  "iss": os.environ["ISSUER_ID"],
                  "iat": now,
                  "exp": now + 600,
                  "aud": "appstoreconnect-v1",
              }).encode())
              msg = f"{header}.{payload}".encode()
              der = subprocess.check_output([
                  "openssl", "dgst", "-sha256", "-sign",
                  os.environ["KEY_PATH"],
              ], input=msg)
              return f"{header}.{payload}.{b64(der_to_raw(der))}"

          def call(method, url, body=None):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  url, data=data, method=method, headers={
                      "Authorization": f"Bearer {token()}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req) as resp:
                      raw = resp.read().decode()
                      return resp.status, json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read().decode()[:500]

          started = datetime.fromisoformat(
              os.environ["UPLOAD_AFTER"].replace("Z", "+00:00")
          )
          apps = call(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/apps"
              "?filter[bundleId]=cc.runtick.app",
          )[1]
          app_id = apps["data"][0]["id"]
          groups = call(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/apps/"
              + app_id + "/betaGroups?limit=20",
          )[1]
          group = next(
              g for g in groups["data"]
              if g["attributes"].get("name") == "Beta"
              and not g["attributes"].get("isInternalGroup")
          )
          deadline = datetime.now(timezone.utc) + timedelta(minutes=30)
          build = None
          while datetime.now(timezone.utc) < deadline:
              listed = call(
                  "GET",
                  "https://api.appstoreconnect.apple.com/v1/builds"
                  f"?filter[app]={app_id}&sort=-uploadedDate&limit=5",
              )[1]
              fresh = []
              for item in listed["data"]:
                  uploaded = datetime.fromisoformat(
                      item["attributes"]["uploadedDate"]
                  )
                  if uploaded >= started:
                      fresh.append(item)
              if fresh:
                  build = fresh[0]
                  state = build["attributes"].get("processingState")
                  print("build", build["attributes"].get("version"), state)
                  if state == "VALID":
                      break
                  if state in {"FAILED", "INVALID"}:
                      raise SystemExit(f"build processing {state}")
              time.sleep(30)
          else:
              raise SystemExit("build was not processed within 30 minutes")
          locs = call(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/builds/"
              + build["id"] + "/betaBuildLocalizations",
          )[1]
          if not any(
              item["attributes"].get("whatsNew")
              for item in locs.get("data", [])
          ):
              status, payload = call(
                  "POST",
                  "https://api.appstoreconnect.apple.com/v1/"
                  "betaBuildLocalizations",
                  {"data": {
                      "type": "betaBuildLocalizations",
                      "attributes": {
                          "locale": "zh-Hans",
                          "whatsNew": "新的测试构建。",
                      },
                      "relationships": {"build": {"data": {
                          "type": "builds", "id": build["id"],
                      }}},
                  }},
              )
              if status not in {200, 201, 409}:
                  raise SystemExit(payload)
          subs = call(
              "GET",
              "https://api.appstoreconnect.apple.com/v1/"
              "betaAppReviewSubmissions?filter[build]="
              + build["id"] + "&limit=5",
          )[1]
          if not subs.get("data"):
              status, payload = call(
                  "POST",
                  "https://api.appstoreconnect.apple.com/v1/"
                  "betaAppReviewSubmissions",
                  {"data": {
                      "type": "betaAppReviewSubmissions",
                      "relationships": {"build": {"data": {
                          "type": "builds", "id": build["id"],
                      }}},
                  }},
              )
              if status not in {200, 201, 409}:
                  raise SystemExit(payload)
          status, payload = call(
              "POST",
              "https://api.appstoreconnect.apple.com/v1/betaGroups/"
              + group["id"] + "/relationships/builds",
              {"data": [{"type": "builds", "id": build["id"]}]},
          )
          if status not in {200, 201, 204, 409}:
              raise SystemExit(payload)
          print("submitted to Beta", build["attributes"].get("version"))
          PY
