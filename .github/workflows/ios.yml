name: iOS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require iOS 27 SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${SDK%%.*}" -lt 27 ]; then
            echo '::error::This app targets iOS 27. Select an Xcode runner with the iOS 27 SDK.'
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: xcodebuild -project RunTick.xcodeproj -scheme RunTick -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Run tests on available iOS 27 simulator
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v[0]["udid"] for k,v in d["devices"].items() if "iOS-27" in k and v))')
          xcodebuild -project RunTick.xcodeproj -scheme RunTick -destination "platform=iOS Simulator,id=$ID" CODE_SIGNING_ALLOWED=NO test-without-building
