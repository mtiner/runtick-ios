name: iOS validation
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require iOS 26 SDK
        run: |
          xcodebuild -version
          SDK=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo '::error::This app targets iOS 26. Select an Xcode runner with the iOS 26 SDK.'
            exit 1
          fi
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build for simulator
        run: xcodebuild -project RunTick.xcodeproj -scheme RunTick -derivedDataPath DerivedData -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Verify bundled audio and images
        run: |
          APP=DerivedData/Build/Products/Debug-iphonesimulator/RunTick.app
          test -f "$APP/Assets.car"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIcons:CFBundlePrimaryIcon:CFBundleIconName" "$APP/Info.plist" | grep -x runtick
          for NAME in gun set on-your-marks; do
            test -f "$APP/$NAME.wav"
          done
      - name: Run tests on available iOS 26 simulator
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v[0]["udid"] for k,v in d["devices"].items() if "iOS-26" in k and v))')
          xcodebuild -project RunTick.xcodeproj -scheme RunTick -derivedDataPath DerivedData -destination "platform=iOS Simulator,id=$ID" CODE_SIGNING_ALLOWED=NO test-without-building
      - name: Capture rendered screens
        run: |
          ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v[0]["udid"] for k,v in d["devices"].items() if "iOS-26" in k and v))')
          xcrun simctl boot "$ID" || true
          xcrun simctl bootstatus "$ID" -b
          xcrun simctl status_bar "$ID" override --time '9:41' --dataNetwork wifi --wifiMode active --wifiBars 3 --batteryState charged --batteryLevel 100
          xcrun simctl install "$ID" DerivedData/Build/Products/Debug-iphonesimulator/RunTick.app
          mkdir -p screenshots
          xcrun simctl launch --terminate-running-process "$ID" cc.runtick.app --brand-preview
          sleep 2
          xcrun simctl io "$ID" screenshot screenshots/launch.png
          xcrun simctl launch --terminate-running-process "$ID" cc.runtick.app -onboarded NO
          sleep 3
          xcrun simctl io "$ID" screenshot screenshots/guide.png
          xcrun simctl launch --terminate-running-process "$ID" cc.runtick.app -onboarded YES
          sleep 3
          xcrun simctl io "$ID" screenshot screenshots/login.png
          xcrun simctl launch --terminate-running-process "$ID" com.mtiner.runtick --starter-preview
          sleep 2
          xcrun simctl io "$ID" screenshot screenshots/starter.png
          xcrun simctl launch --terminate-running-process "$ID" com.mtiner.runtick --finish-preview
          sleep 2
          xcrun simctl io "$ID" screenshot screenshots/finish.png
      - uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: screenshots/
