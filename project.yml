name: RunTick
options:
  bundleIdPrefix: com.mtiner
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: RunTick 燃刻
    INFOPLIST_KEY_NSMotionUsageDescription: 检查运动传感器是否可用，计时使用枪声和触屏。
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  RunTick:
    type: application
    platform: iOS
    sources:
      - path: RunTick
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtiner.runtick
  RunTickTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunTickTests]
    dependencies:
      - target: RunTick
schemes:
  RunTick:
    build:
      targets:
        RunTick: all
        RunTickTests: [test]
    test:
      targets: [RunTickTests]
