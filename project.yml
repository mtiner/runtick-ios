name: RunTick
options:
  bundleIdPrefix: cc.runtick
  deploymentTarget:
    iOS: '26.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    IPHONEOS_DEPLOYMENT_TARGET: '26.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: 7D7486BA97
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: runtick
    INFOPLIST_KEY_CFBundleDisplayName: RunTick 燃刻
    INFOPLIST_KEY_NSMotionUsageDescription: 开启起跑反应检测后，使用加速度计和陀螺仪检测起跑器上的手机移动；运动采样仅在本机处理。
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
      UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: >-
      UIInterfaceOrientationPortrait
      UIInterfaceOrientationPortraitUpsideDown
      UIInterfaceOrientationLandscapeLeft
      UIInterfaceOrientationLandscapeRight
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
targets:
  RunTick:
    type: application
    platform: iOS
    sources:
      - path: RunTick
        excludes: [Resources/runtick.icon]
      - path: RunTick/Resources/runtick.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: cc.runtick.app
        ASSETCATALOG_COMPILER_APPICON_NAME: runtick
  RunTickTests:
    type: bundle.unit-test
    platform: iOS
    sources: [RunTickTests]
    dependencies:
      - target: RunTick
schemes:
  RunTick:
    build:
      targets:
        RunTick: all
        RunTickTests: [test]
    test:
      targets: [RunTickTests]
